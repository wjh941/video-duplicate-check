# ============================================================
# find_mp4.py v2.6 配置文件模板
# ============================================================
# 用法：将此文件放在 find_mp4.py 同目录，或通过 --config 指定路径。
# 命令行参数优先级高于配置文件，仅当命令行未显式传入时才覆盖。
# ============================================================

[scan]
# 扫描目录（必填，或通过 --dir 指定）
dir = D:\Videos
# 相似度阈值 (0.0~1.0)，默认 0.7
threshold = 0.7
# 抽取帧数，默认 10
frames = 10
# 线程数，0=自动适配CPU核心
workers = 0
# 输出目录，默认程序同目录
output_dir =
# 导出格式：txt / md / html / xlsx
format = txt
# 视频后缀，逗号分隔
ext = mp4
# 最小相似度导出阈值
min_sim = 0.0
# 二次校验模式
double_check = false
# 音频辅助比对（需 FFmpeg）
audio_check = false
# 快速模式
fast = false
# 增量扫描
incremental = false
# 保留策略：keep-latest / keep-max-res / keep-max-bitrate
keep_latest = false
keep_max_res = false
keep_max_bitrate = false
# AI 语义分析
semantic = false
# 用途筛选
purpose_filter =
# 语义聚类
cluster_semantic = false
# 数据集导出
export_dataset = false
# 场景标签置信度阈值
scene_thresh = 0.6
# 持久化CLIP特征向量
embed_cache = false
# 静默模式
quiet = false
# 试运行
dry_run = false

# ========== v2.4 新增参数 ==========

# 时长筛选条件，格式：>=60、<30、>120&<=360（单位秒，支持 & 多条件并列）
duration_filter =
# 仅统计符合时长条件视频数量，不执行查重（纯计数快速模式）
duration_stat = false
# 导出符合时长条件视频路径清单到 txt
duration_export = false
# 不将预览帧持久化存入缓存，降低内存占用
no_store_frames = false
# 筛选最小分辨率宽度，如 1920；0=不限制
min_res = 0
# 筛选最大分辨率宽度，如 3840；0=不限制
max_res = 0
# 根据审计日志生成视频恢复 bat/sh 脚本
gen_restore = false
# 仅输出待清理视频路径清单，不含保留素材
export_clean_list = false
# 自定义输出文件前缀，多批次扫描不覆盖报告
output_prefix =
# 审计日志、报告隐藏路径中间层级，保护素材隐私
path_mask = false
# 语义聚类松紧阈值，默认 0.5（越小越严格）
cluster_thresh = 0.5
# 过滤 AI 判定低质量模糊暗光视频，不参与后续查重
skip_low_quality = false
# 数据集拆分使用硬链接，不重复复制视频节省磁盘
link_mode = false
# 缓存 gzip 压缩存储（.gz）
compress_cache = false
# 永久删除（危险！需二次确认）
hard_delete = false
# 清理前备份视频到指定目录
backup_path =
# 保护目录（逗号分隔，使用完整分隔符精准匹配）
protect_folder =
# 保护清单文件路径
protect_file =

# ========== v2.5 新增 AI 自动分类参数 ==========

# 仅执行 AI 自动分类，不查重（对应 --classify-only）
classify_only = false
# AI 自动分类算法（目前支持 kmeans）
classify_method = kmeans
# 自动分类目标聚类数（0=自动估算）
n_clusters = 0
# 执行文件操作（默认 dry-run 预览模式，不修改文件）
execute = false

# ========== v2.6 新增拓展工具参数 ==========

# 自定义所有报告前缀名称
report_name =
# 扫描完成自动生成 PDF 完整报告（需 reportlab）
export_pdf = false
# 批量扫描文件夹 txt 路径文件（一行一个目录）
batch_dir_list =
# 扫描时过滤带指定标签素材
tag =
# 语义检索指定画面视频，传入描述文本
similar_search =

# ========== v2.6 看板与报告配置 ==========

[dashboard]
# 看板主题（light/dark）
theme = light
# 看板默认端口
port = 8501
# 报告水印文字
watermark =
# 默认导出格式（html/md/xlsx）
default_format = html

[weights]
# ============================================================
# 自定义相似度权重配置（v2.4 新增）
# 替代代码硬编码 0.7/0.3/0.8
# ============================================================
# pHash 权重（感知哈希，主导画面相似度）
phash_weight = 0.7
# dHash 权重（差异哈希，辅助细节比对）
dhash_weight = 0.3
# 音频惩罚折扣系数（仅双方都有音频且音频相似度<0.3时生效）
audio_weight = 0.8
