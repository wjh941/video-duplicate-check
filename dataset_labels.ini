# ============================================================
# 视频数据集标签配置文件 (v2.3 新增)
# ============================================================
# 说明：
#   - 本文件定义 AI 语义分析使用的场景、物体、行为、数据集用途标签
#   - 程序启动时自动读取本文件，用户可自定义标签无需修改源码
#   - 格式：[分类] 下每行 key = value，逗号分隔为同义词
#   - 修改后需重新运行 --semantic 才会生效
# ============================================================

[scene]
labels = 室内监控楼道, 室外道路, 停车场, 小区, 办公室, 教室, 户外公园, 车内, 夜晚监控, 夜晚暗光, 商场, 仓库, 医院, 工地

[object]
labels = 行人, 电动车, 轿车, 货车, 监控设备, 桌椅, 绿植, 猫狗, 人脸, 自行车, 背包, 手机

[action]
labels = 行走, 跑动, 静止, 骑车, 交谈, 搬运, 驾驶

[dataset_purpose]
labels = 监控训练集, 自动驾驶数据集, 人像素材, 影视素材, 风景素材, 游戏录屏

[purpose_rules]
监控训练集 = 行人, 监控, 楼道, 道路, 夜晚, 摄像头
自动驾驶数据集 = 车辆, 轿车, 货车, 道路, 路面, 车流, 车内
人像素材 = 人脸, 人像, 人物, 特写
影视素材 = 电影, 剧情, 镜头, 人物, 场景
风景素材 = 自然, 山水, 天空, 公园, 风景
游戏录屏 = 游戏, UI, 界面, 角色

[quality]
min_clarity = 0.3
min_brightness = 0.2
min_subject_ratio = 0.1
training_score_threshold = 0.4
