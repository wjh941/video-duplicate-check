name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # 遗留自测脚本输出中文：Windows 运行器默认 cp1252 会 UnicodeEncodeError，
      # 统一强制 UTF-8（与 video_dedup/__init__.py 的 stdout 加固双保险）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # opencv-python-headless：CI 无 GUI 也可用 VideoWriter 合成测试视频
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy Pillow imagehash tqdm psutil
          pip install pytest pytest-cov

      - name: Run test suite with coverage
        shell: bash
        run: |
          pytest tests --cov=video_dedup --cov-report=term-missing --cov-report=xml 2>&1 | tee /tmp/pytest.log
          exit ${PIPESTATUS[0]}

      - name: Report pytest failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -n 8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 3 /tmp/pytest.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Legacy self-tests (no pytest, behavior parity)
        run: |
          python find_mp4.py version
          python find_mp4.py test

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
